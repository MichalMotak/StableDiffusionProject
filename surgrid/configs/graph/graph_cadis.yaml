data_root: /path/to/CaDISv2
log_dir: ./results
split_files:
  train: ./configs/split/cadis_train.txt
  val: ./configs/split/cadis_val.txt
  test: ./configs/split/cadis_test.txt
  
size: 128
batch_size: 32
num_workers: 8
weight_decay: 1e-5
patience: 1
factor: 0.8
epochs: 200
device: cuda

graph_encoder_lr_segclip: 1e-4
graph_encoder_lr_masked: 5e-5 
graph_input_dim: 21 # class_size + 2 + 2
graph_hidden_dim: 256
graph_embedding_dim: 256

image_encoder_lr: 1e-6
image_embedding_dim: 256
image_encoder_config: ./results/vqgan_image/config.yaml
image_encoder_ckpt: ./results/vqgan_image/checkpoint.ckpt

segmentation_embedding_dim: 256
segmentation_encoder_config: ./results/vqgan_segmentation/config.yaml
segmentation_encoder_ckpt: ./results/vqgan_segmentation/checkpoint.ckpt

trainable: True
temperature: 1.0
dropout: 0.2