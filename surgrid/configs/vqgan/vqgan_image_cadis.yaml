model:
  base_learning_rate: 4.5e-6
  target: surgrid.taming.taming.models.vqgan.VQModel
  params:
    embed_dim: 1
    n_embed: 16384
    image_key: image
    ddconfig:
      double_z: false
      z_channels: 1
      resolution: 128
      in_channels: 3
      out_ch: 3
      ch: 128
      ch_mult:
      - 1
      - 2
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
    lossconfig:
      target: surgrid.taming.taming.modules.losses.vqperceptual.VQLPIPSWithDiscriminator
      params:
        disc_conditional: false
        disc_in_channels: 3
        disc_num_layers: 2
        disc_start: 1
        disc_weight: 0.6
        codebook_weight: 1.0

data:
  target: surgrid.taming.main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    train:
      target: surgrid.taming.taming.data.cadis.CadisBase
      params:
        txt_file: ./configs/split/cadis_train.txt
        size: 128
        augment: True
        data_root: /path/to/CaDISv2

    validation:
      target: surgrid.taming.taming.data.cadis.CadisBase
      params:
        txt_file: ./configs/split/cadis_val.txt
        size: 128
        augment: False
        data_root: /path/to/CaDISv2