model:
  base_learning_rate: 4.5e-6
  target: surgrid.taming.taming.models.vqgan.VQSegmentationModel
  params:
    embed_dim: 1
    n_embed: 8192
    image_key: segmentation
    n_labels: 18
    palatte: cadis
    ddconfig:
      double_z: false
      z_channels: 1
      resolution: 128
      in_channels: 18
      out_ch: 18
      ch: 128
      ch_mult:
      - 1
      - 2
      - 2
      - 4
      num_res_blocks: 2
      attn_resolutions:
      - 16
      dropout: 0.0
    lossconfig:
      target: surgrid.taming.taming.modules.losses.segmentation.BCELossWithQuant
      params:
        codebook_weight: 1.0

data:
  target: surgrid.taming.main.DataModuleFromConfig
  params:
    batch_size: 16
    num_workers: 8
    train:
      target: surgrid.taming.taming.data.cadis.CadisBase
      params:
        txt_file: ./configs/split/cadis_train.txt
        size: 128
        augment: True
        data_root: /path/to/CaDISv2

    validation:
      target: surgrid.taming.taming.data.cadis.CadisBase
      params:
        txt_file: ./configs/split/cadis_val.txt
        size: 128
        augment: False
        data_root: /path/to/CaDISv2